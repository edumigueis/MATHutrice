name: CI

# Runs on every pull request, and on every push to the default branch, so a
# change that breaks the package boundaries is seen before it is merged.
on:
  pull_request:
  push:
    branches: [course-2026]

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # uv installs the Python in .python-version and the versions in uv.lock.
      - run: uv sync --locked
      # A step that exits non-zero fails the job, which turns the check red.
      - name: Private names stay inside their package
        run: uv run tach check
      - name: No import cycle between packages
        run: uv run python scripts/check_cycles.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run pytest
